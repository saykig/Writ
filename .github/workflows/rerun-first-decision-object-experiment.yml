name: rerun first decision object experiment

on:
  push:
    branches:
      - experiment/first-decision-object-proving-case
    paths:
      - '.github/workflows/rerun-first-decision-object-experiment.yml'

permissions:
  contents: write

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/first-decision-object-proving-case
          fetch-depth: 0

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'

      - uses: julia-actions/cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instantiate pinned donor environment
        working-directory: experiments/decision-object/first-proving-case
        run: julia --project=. setup.jl

      - name: Run direct donor baseline
        working-directory: experiments/decision-object/first-proving-case
        run: julia --project=. direct_baseline.jl

      - name: Run corrected Writ adapter
        working-directory: experiments/decision-object/first-proving-case
        run: julia --project=. run_writ.jl case.json writ-result.json

      - name: Run deterministic order-corruption mutation
        working-directory: experiments/decision-object/first-proving-case
        run: julia --project=. order_corruption_baseline.jl

      - name: Run changed-information donor variant
        working-directory: experiments/decision-object/first-proving-case
        run: julia --project=. memory_leak_baseline.jl

      - name: Run independent exact checker
        shell: bash
        working-directory: experiments/decision-object/first-proving-case
        run: |
          set -euo pipefail
          python3 check.py 2>&1 | tee checker-output.txt

      - name: Record environment and results
        working-directory: experiments/decision-object/first-proving-case
        run: |
          julia --project=. -e 'using Pkg; Pkg.status()' > environment-status.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          here = Path('.')
          direct = json.loads((here / 'direct-result.json').read_text())
          writ = json.loads((here / 'writ-result.json').read_text())
          corrupt = json.loads((here / 'order-corruption-result.json').read_text())
          leak = json.loads((here / 'memory-leak-result.json').read_text())
          lines = [
              '# First proving-case execution',
              '',
              f"Direct donor expected utility: {direct['expected_utility']}",
              f"Correct Writ adapter expected utility: {writ['expected_utility']}",
              f"Order-corrupted lowering reported utility: {corrupt['expected_utility']}",
              f"Changed-information donor expected utility: {leak['expected_utility']}",
              '',
              'The independent checker accepted the direct donor and corrected Writ results and rejected both semantic mutations.',
              'See `checker-output.txt` for the exact checks.',
          ]
          (here / 'execution.md').write_text('\n'.join(lines) + '\n')
          PY

      - name: Commit validated evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rerun-first-decision-object-experiment.yml
          git add experiments/decision-object/first-proving-case/Manifest.toml
          git add experiments/decision-object/first-proving-case/direct-result.json
          git add experiments/decision-object/first-proving-case/writ-result.json
          git add experiments/decision-object/first-proving-case/order-corruption-result.json
          git add experiments/decision-object/first-proving-case/memory-leak-result.json
          git add experiments/decision-object/first-proving-case/checker-output.txt
          git add experiments/decision-object/first-proving-case/environment-status.txt
          git add experiments/decision-object/first-proving-case/execution.md
          git commit -m "Validate first decision-object proving case"
          git push
