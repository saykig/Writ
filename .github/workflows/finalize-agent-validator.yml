name: finalize agent validator

on:
  push:
    branches:
      - architecture/decision-object-reset
    paths:
      - '.github/workflows/finalize-agent-validator.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architecture/decision-object-reset
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: python -m pip install --no-cache-dir PyYAML jsonschema
      - name: Check the updated pack validator
        run: python internal/tooling/scripts/validate_pack.py
      - name: Commit the final tree and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-agent-validator.yml
          git add internal/tooling/scripts/validate_pack.py
          git ls-files | grep -v '^MANIFEST.sha256$' | LC_ALL=C sort | while IFS= read -r file; do sha256sum "$file"; done > MANIFEST.sha256
          git add MANIFEST.sha256
          git commit -m "Finalize agent validator update"
          git push
      - name: Verify final repository
        run: |
          python internal/tooling/scripts/validate_pack.py
          bun install --frozen-lockfile
          bun run format
          bun run lint
          bun run typecheck
          bun run test
          bun run data:check
          bun run verify:writ
          bun run build
