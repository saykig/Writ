name: run second family model checking

on:
  push:
    branches:
      - experiment/second-family-model-checking
    paths:
      - '.github/workflows/run-second-family-model-checking.yml'

permissions:
  contents: write

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/second-family-model-checking
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned donor systems
        run: python -m pip install --no-cache-dir 'stormpy==1.14.0' 'stormvogel==0.12.0'

      - name: Check experiment scripts
        working-directory: experiments/decision-object/second-family-model-checking
        run: python -m py_compile direct_baseline.py run_writ.py check.py

      - name: Run direct Stormvogel baseline
        working-directory: experiments/decision-object/second-family-model-checking
        run: python direct_baseline.py

      - name: Run Writ Storm adapter
        working-directory: experiments/decision-object/second-family-model-checking
        run: python run_writ.py

      - name: Run optimization-direction mutation
        working-directory: experiments/decision-object/second-family-model-checking
        run: python run_writ.py --output min-result.json --source min-direction-mutation --direction min

      - name: Run stopping-condition mutation
        working-directory: experiments/decision-object/second-family-model-checking
        run: python run_writ.py --output stop-result.json --source stop-label-mutation --stop-label 'starving :(('

      - name: Run independent exact checker
        shell: bash
        working-directory: experiments/decision-object/second-family-model-checking
        run: |
          set -euo pipefail
          python check.py 2>&1 | tee checker-output.txt

      - name: Record donor environment
        working-directory: experiments/decision-object/second-family-model-checking
        run: |
          python - <<'PY' > environment.txt
          import importlib.metadata
          import platform
          print(f"Python {platform.python_version()}")
          print(f"stormpy {importlib.metadata.version('stormpy')}")
          print(f"stormvogel {importlib.metadata.version('stormvogel')}")
          PY

      - name: Commit successful execution evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/run-second-family-model-checking.yml
          git add experiments/decision-object/second-family-model-checking/direct-result.json
          git add experiments/decision-object/second-family-model-checking/writ-result.json
          git add experiments/decision-object/second-family-model-checking/min-result.json
          git add experiments/decision-object/second-family-model-checking/stop-result.json
          git add experiments/decision-object/second-family-model-checking/checker-output.txt
          git add experiments/decision-object/second-family-model-checking/environment.txt
          git commit -m "Execute second-family model-checking case"
          git push
