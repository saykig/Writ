name: validate strengthened second-family gate

on:
  push:
    branches:
      - experiment/second-family-model-checking
    paths:
      - '.github/workflows/validate-second-family-exact-gate.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/second-family-model-checking
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned donor stack
        run: python -m pip install --no-cache-dir 'stormpy[parser]==1.14.0' 'stormvogel==0.12.3'

      - name: Run direct Stormvogel baseline
        working-directory: experiments/decision-object/second-family-model-checking
        run: python direct_baseline.py

      - name: Run Writ sparse-double paths
        working-directory: experiments/decision-object/second-family-model-checking
        run: |
          python run_writ.py
          python run_writ.py --direction min --output min-result.json --source writ-stormpy-min
          python run_writ.py --stop-state starving --output stop-result.json --source writ-stormpy-stop

      - name: Run Storm exact-rational paths
        working-directory: experiments/decision-object/second-family-model-checking
        run: |
          python exact_storm.py
          python exact_storm.py --direction min --output exact-storm-min-result.json --source writ-storm-exact-min
          python exact_storm.py --stop-state starving --output exact-storm-stop-result.json --source writ-storm-exact-stop

      - name: Run strengthened independent checker
        shell: bash
        working-directory: experiments/decision-object/second-family-model-checking
        run: |
          set -euo pipefail
          python check.py 2>&1 | tee checker-output.txt

      - name: Record environment
        working-directory: experiments/decision-object/second-family-model-checking
        run: |
          python - <<'PY' > environment.txt
          import platform
          import importlib.metadata
          print(f"Python {platform.python_version()}")
          print(f"stormpy {importlib.metadata.version('stormpy')}")
          print(f"stormvogel {importlib.metadata.version('stormvogel')}")
          PY

      - name: Commit validated evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-second-family-exact-gate.yml
          git add experiments/decision-object/second-family-model-checking/direct-result.json
          git add experiments/decision-object/second-family-model-checking/writ-result.json
          git add experiments/decision-object/second-family-model-checking/min-result.json
          git add experiments/decision-object/second-family-model-checking/stop-result.json
          git add experiments/decision-object/second-family-model-checking/exact-storm-result.json
          git add experiments/decision-object/second-family-model-checking/exact-storm-min-result.json
          git add experiments/decision-object/second-family-model-checking/exact-storm-stop-result.json
          git add experiments/decision-object/second-family-model-checking/checker-output.txt
          git add experiments/decision-object/second-family-model-checking/environment.txt
          git commit -m "Validate strengthened second-family gate"
          git push
