name: finalize design principles

on:
  push:
    branches:
      - architecture/decision-object-reset
    paths:
      - '.github/workflows/finalize-design-principles.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architecture/decision-object-reset
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Format current documentation
        run: >-
          bunx prettier --write README.md AGENTS.md docs/README.md
          docs/current/design-principles.md
      - name: Commit final documentation state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-design-principles.yml
          git add README.md AGENTS.md docs/README.md docs/current/design-principles.md
          git ls-files | grep -v '^MANIFEST.sha256$' | LC_ALL=C sort | while IFS= read -r file; do sha256sum "$file"; done > MANIFEST.sha256
          git add MANIFEST.sha256
          git commit -m "Finalize Writ design principles"
          git push
      - name: Verify final repository
        run: |
          bun install --frozen-lockfile
          bun run format
          bun run lint
          bun run typecheck
          bun run test
          bun run data:check
          bun run verify:writ
          bun run build
