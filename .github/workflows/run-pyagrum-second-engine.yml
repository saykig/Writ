# stable pyAgrum 3.0 API rerun
name: run pyagrum second engine

on:
  push:
    branches:
      - experiment/first-decision-object-proving-case
    paths:
      - '.github/workflows/run-pyagrum-second-engine.yml'

permissions:
  contents: write

jobs:
  second-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/first-decision-object-proving-case
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned pyAgrum
        run: python -m pip install --no-cache-dir 'pyAgrum==3.0.0'

      - name: Run pyAgrum adapter
        working-directory: experiments/decision-object/first-proving-case
        run: python pyagrum_adapter.py

      - name: Run cross-engine exact checker
        shell: bash
        working-directory: experiments/decision-object/first-proving-case
        run: |
          set -euo pipefail
          python check.py 2>&1 | tee checker-output.txt

      - name: Record Python donor environment
        working-directory: experiments/decision-object/first-proving-case
        run: |
          python - <<'PY' > pyagrum-environment.txt
          import platform
          import pyagrum
          print(f"Python {platform.python_version()}")
          print(f"pyAgrum {pyagrum.__version__}")
          PY

      - name: Commit validated second-engine evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/run-pyagrum-second-engine.yml
          git add experiments/decision-object/first-proving-case/pyagrum-result.json
          git add experiments/decision-object/first-proving-case/pyagrum-environment.txt
          git add experiments/decision-object/first-proving-case/checker-output.txt
          git commit -m "Validate decision object against pyAgrum"
          git push
