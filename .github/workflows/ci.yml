name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  writ-verification:
    name: Writ verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # These hosted gates need CPU execution, not multi-gigabyte CUDA wheels.
      - name: Install CPU-only PyTorch for ingestion dependencies
        run: python -m pip install --no-cache-dir "torch>=2.2.2,<3" "torchvision<1" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install --no-cache-dir -e "apps/ingest[dev]"
      - name: Verify the hosted CPU profile
        run: python -c "import torch; assert torch.version.cuda is None; print(torch.__version__)"
      - name: Writ verification
        run: bun run verify:writ

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run format
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run data:check
      - run: bun run build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # These hosted gates need CPU execution, not multi-gigabyte CUDA wheels.
      - name: Install CPU-only PyTorch for ingestion dependencies
        run: python -m pip install --no-cache-dir "torch>=2.2.2,<3" "torchvision<1" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install --no-cache-dir -e "apps/ingest[dev]"
      - name: Verify the hosted CPU profile
        run: python -c "import torch; assert torch.version.cuda is None; print(torch.__version__)"
      - run: python internal/tooling/scripts/validate_pack.py
      - run: python internal/tooling/scripts/generate_source_registry.py --check
      - run: ruff check apps/ingest internal/tooling/scripts internal/verification
      - run: mypy apps/ingest/src
      - run: pytest apps/ingest internal/verification
