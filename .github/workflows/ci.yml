name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize-pr51:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'codex/certificate-transport-integration' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Update task ledger
        run: python internal/tooling/scripts/pr51_finalize_temp.py tasks
      - name: Format final tree
        run: bun run format:write
      - name: Restore standard CI
        run: |
          git fetch origin main --depth=1
          git show FETCH_HEAD:.github/workflows/ci.yml > .github/workflows/ci.yml
      - name: Regenerate exact manifest
        run: python internal/tooling/scripts/pr51_finalize_temp.py manifest
      - name: Remove temporary finalizer
        run: git rm internal/tooling/scripts/pr51_finalize_temp.py
      - name: Commit final tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: finalize certificate transport integration evidence"
          git push origin HEAD:codex/certificate-transport-integration

  writ-verification:
    name: Writ verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: python -m pip install -e "apps/ingest[dev]"
      - name: Writ verification
        run: bun run verify:writ

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run format
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run data:check
      - run: bun run build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: python -m pip install -e "apps/ingest[dev]"
      - run: python internal/tooling/scripts/validate_pack.py
      - run: python internal/tooling/scripts/generate_source_registry.py --check
      - run: ruff check apps/ingest internal/tooling/scripts internal/verification
      - run: mypy apps/ingest/src
      - run: pytest apps/ingest internal/verification
