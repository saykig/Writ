name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize-pr51-evidence:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'codex/certificate-transport-integration' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Record final exact-head validation
        run: |
          python - <<'PY'
          from pathlib import Path

          report_path = Path('docs/experiments/certificate-transport-integration-report.md')
          report = report_path.read_text()
          old = '''Because `saykig/writ-decision-lab` is private, Writ's ordinary repository token cannot perform a
cross-repository checkout. The real no-skip integration therefore ran from a temporary private
Decision Lab validation branch while checking out the exact Writ implementation commit
`dccd5908debc6f364723a69d15a0364aea4acd00`.

Validation run:

- Decision Lab Actions run: `34181930145`;
- job: `101922604267`;
- CPython: `3.13.15`;
- Bun: `1.3.12`;
- SciPy: `1.17.0`;
- result: **success**.
'''
          new = '''Because `saykig/writ-decision-lab` is private, Writ's ordinary repository token cannot perform a
cross-repository checkout. The real no-skip integration therefore ran from a temporary private
Decision Lab validation branch while checking out the exact finalized Writ implementation head
`2c4b533f747e3d9ac7beb358a42b7dcaddb6d5c8`.

Final validation run:

- Decision Lab Actions run: `34182781529`;
- job: `101925055730`;
- CPython: `3.13.15`;
- Bun: `1.3.12`;
- SciPy: `1.17.0`;
- result: **success**.
'''
          if old not in report:
              raise SystemExit('expected report validation block not found')
          report = report.replace(old, new, 1)
          old_tail = '''A final exact-head validation is required after documentation, task-ledger, formatting, and manifest
changes. If any semantic code changes after the executed commit, the real integration must be rerun
rather than inferred from this evidence.
'''
          new_tail = '''The exact finalized semantic head above passed all three no-skip integration gates. GitHub's
synthetic merge with current `main` also passed the standard Writ verification suite. Any later
semantic code change requires another real backend run rather than inference from this evidence.
'''
          if old_tail not in report:
              raise SystemExit('expected report final-validation note not found')
          report_path.write_text(report.replace(old_tail, new_tail, 1))

          tasks_path = Path('TASKS.yaml')
          tasks = tasks_path.read_text()
          old_tasks = '''      provenance. A private Decision Lab validation run against Writ commit
      dccd5908debc6f364723a69d15a0364aea4acd00 passed Decision Case 16/16, Shared Analysis 2/2,
      and Certificate Transport 4/4 with zero skips. The reusable semantic is retained narrowly as a
'''
          new_tasks = '''      provenance. Final Decision Lab validation run 34182781529 against Writ head
      2c4b533f747e3d9ac7beb358a42b7dcaddb6d5c8 passed Decision Case 16/16, Shared Analysis 2/2,
      and Certificate Transport 4/4 with zero skips. The reusable semantic is retained narrowly as a
'''
          if old_tasks not in tasks:
              raise SystemExit('expected task validation block not found')
          tasks_path.write_text(tasks.replace(old_tasks, new_tasks, 1))
          PY
      - name: Format final tree
        run: bun run format:write
      - name: Restore standard CI
        run: |
          git fetch origin main --depth=1
          git show FETCH_HEAD:.github/workflows/ci.yml > .github/workflows/ci.yml
      - name: Regenerate exact manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess

          names = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          tracked = sorted(raw.decode() for raw in names if raw and raw.decode() != 'MANIFEST.sha256')
          Path('MANIFEST.sha256').write_text(''.join(
              f"{hashlib.sha256(Path(name).read_bytes()).hexdigest()}  {name}\n"
              for name in tracked
          ))
          PY
      - name: Commit final evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: record final certificate transport validation"
          git push origin HEAD:codex/certificate-transport-integration

  writ-verification:
    name: Writ verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: python -m pip install -e "apps/ingest[dev]"
      - name: Writ verification
        run: bun run verify:writ

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run format
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run data:check
      - run: bun run build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: python -m pip install -e "apps/ingest[dev]"
      - run: python internal/tooling/scripts/validate_pack.py
      - run: python internal/tooling/scripts/generate_source_registry.py --check
      - run: ruff check apps/ingest internal/tooling/scripts internal/verification
      - run: mypy apps/ingest/src
      - run: pytest apps/ingest internal/verification
