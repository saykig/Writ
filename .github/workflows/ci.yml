name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  writ-verification:
    name: Writ verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: python -m pip install -e "apps/ingest[dev]"
      - name: Writ verification
        run: bun run verify:writ

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/certificate-transport-integration
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Apply Prettier repair
        run: |
          bun run format:write
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/shared-analysis/src/transport-engine.ts packages/shared-analysis/src/transport-integration.ts packages/shared-analysis/src/transport-types.ts packages/shared-analysis/test/certificate-transport.integration.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format certificate transport integration"
            git push origin HEAD:codex/certificate-transport-integration
          fi

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: python -m pip install -e "apps/ingest[dev]"
      - run: python internal/tooling/scripts/validate_pack.py
      - run: python internal/tooling/scripts/generate_source_registry.py --check
      - run: ruff check apps/ingest internal/tooling/scripts internal/verification
      - run: mypy apps/ingest/src
      - run: pytest apps/ingest internal/verification
