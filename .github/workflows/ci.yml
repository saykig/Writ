name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  writ-verification:
    name: Writ verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: python -m pip install -e "apps/ingest[dev]"
      - name: Writ verification
        run: bun run verify:writ

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run format
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run data:check
      - run: bun run build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: python -m pip install -e "apps/ingest[dev]"
      - run: python internal/tooling/scripts/validate_pack.py
      - run: python internal/tooling/scripts/generate_source_registry.py --check
      - run: ruff check apps/ingest internal/tooling/scripts internal/verification
      - run: mypy apps/ingest/src
      - run: pytest apps/ingest internal/verification
