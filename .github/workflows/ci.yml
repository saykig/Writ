name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run format
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - run: python -m pip install -e "apps/ingest[dev]"
      - run: python scripts/generate_source_registry.py --check
      - run: ruff check apps/ingest
      - run: mypy apps/ingest/src
      - run: pytest apps/ingest tests

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: writ
          POSTGRES_PASSWORD: writ
          POSTGRES_DB: writ
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U writ -d writ"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - run: PGPASSWORD=writ psql -h localhost -U writ -d writ -v ON_ERROR_STOP=1 -f db/migrations/0001_initial.sql
      - run: PGPASSWORD=writ psql -h localhost -U writ -d writ -v ON_ERROR_STOP=1 -f db/migrations/0002_bitemporal_immutability.sql
      - run: PGPASSWORD=writ psql -h localhost -U writ -d writ -v ON_ERROR_STOP=1 -f db/migrations/0003_source_registry.sql
      - run: PGPASSWORD=writ psql -h localhost -U writ -d writ -v ON_ERROR_STOP=1 -f db/migrations/0004_corpus_artifact_store.sql
