services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: writ
      POSTGRES_PASSWORD: writ
      POSTGRES_DB: writ
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U writ -d writ"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
