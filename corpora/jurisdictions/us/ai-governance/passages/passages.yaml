  anchor_phrase: Establish voluntary agreements with private sector AI developers
  quote: Establish voluntary agreements with private sector AI developers and evaluators, and lead unclassified
    evaluations of AI capabilities that may pose risks to national security. In conducting these evaluations,
    CAISI will focus on demonstrable risks, such as cybersecurity, biosecurity, and chemical weapons.
