    anchor_phrase: considering whether to adopt a Federal reporting and disclosure
    quote:
      The Order instructs the Federal Trade Commission and Federal Communications Commission to take
      actions that will limit States’ ability to force AI companies to deceive consumers, including determining
      whether laws that force companies to embed DEI into their models cause those companies to violate
      the Federal Trade Commission Act, and considering whether to adopt a Federal reporting and disclosure
      standard for AI models.
