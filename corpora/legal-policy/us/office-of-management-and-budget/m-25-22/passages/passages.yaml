    quote: 'E. Ongoing Testing and Monitoring. Contractual terms must provide the contracting agency the
      ability to regularly monitor and evaluate ( e.g., on a quarterly or biannual basis, based on the
      needs of the program) performance, risks, and effectiveness of an AI system or service. To achieve
      that outcome:'
