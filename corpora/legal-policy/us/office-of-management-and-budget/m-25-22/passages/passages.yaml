    anchor_phrase: Testing and Evaluation. When evaluating proposals
    quote: Testing and Evaluation. When evaluating proposals agencies must, to the greatest extent practicable,
      test proposed solutions to understand the capabilities and limitations of any offered AI system
      or service. As part of this work, agencies should consider whether it is appropriate to create a
      testing environment in agency networks specifically to enable testing ofproposed solutions on government-owned
      systems.
