# Stage A implements the approved human review of the six automated drafts against
# the native institutional v0.2 contract. No object was deleted: the relationship
# record became a Core link and the misclassified function is retained as history.
previous_contract:
  kind: compatibility
  id: https://writ.example/schemas/compatibility/record-grammar-v0.1/institutional-record.schema.json
  version: 0.1.0
final_contract:
  kind: native
  id: https://writ.example/schemas/extensions/institutional-record.schema.json
  version: 0.2.0
entries:
  - previous_object: nist_identity
    previous_form: v0.1 compatibility institutional record
    final_object: nist_identity
    final_form: native v0.2 atomic identity record
    final_review_state: approved
    identity_preserved: true
  - previous_object: nist_organizational_placement
    previous_form: v0.1 compatibility institutional record
    final_object: nist_organizational_placement
    final_form: native v0.2 atomic placement record
    final_review_state: approved
    identity_preserved: true
  - previous_object: nist_department_of_commerce_relationship
    previous_form: v0.1 institutional record duplicating the placement fact
    final_object: nist_department_of_commerce_relationship
    final_form: standalone Core record link, relation_type part_of
    final_review_state: approved
    identity_preserved: true
    note: The object became a Core record link rather than being deleted. It cites
      nist_organizational_placement in supporting_record_ids; that record remains the
      authoritative institutional fact and the link is not a second assertion of it.
  - previous_object: nist_measurement_science_function
    previous_form: v0.1 compatibility function record
    final_object: nist_measurement_science_function
    final_form: native v0.2 function record retained as history
    final_review_state: superseded
    identity_preserved: true
    note: The cited passage is explicitly a mission statement. The record remains resolvable as
      superseded review history; it is not deleted and carries no record-level superseded_by
      field. Its replacement is stated by the Core supersession link.
  - previous_object: null
    previous_form: none
    final_object: nist_mission
    final_form: native v0.2 atomic mission record
    final_review_state: approved
    identity_preserved: false
    note: New record produced by the approved human-review split. Its provenance is the
      implementation of that review, not an original automated draft.
  - previous_object: null
    previous_form: none
    final_object: nist_mission_supersedes_nist_measurement_science_function
    final_form: standalone Core record link, relation_type supersedes
    final_review_state: approved
    identity_preserved: false
    note: Directed from the newer approved mission record to the older superseded function record.
  - previous_object: nist_ai_standards_development_function
    previous_form: v0.1 compatibility institutional record
    final_object: nist_ai_standards_development_function
    final_form: native v0.2 atomic function record
    final_review_state: approved
    identity_preserved: true
  - previous_object: nist_ai_technical_guidance_function
    previous_form: v0.1 compatibility institutional record
    final_object: nist_ai_technical_guidance_function
    final_form: native v0.2 atomic function record
    final_review_state: approved
    identity_preserved: true
