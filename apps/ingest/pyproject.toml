[project]
name = "writ-ingest"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "httpx",
  "scrapy",
  "playwright",
  "trafilatura",
  "pymupdf",
  "docling",
  "tika",
  "warcio",
  "rapidfuzz",
  "python-dateutil",
  "boto3",
  "psycopg[binary,pool]",
  "structlog"
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy", "respx"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
