decision_rule:
  description: >-
    A human reviewer must inspect the exact target assertion, institutional fact payload, selected
    evidence passages, uncertainties and proposed disposition before recording an approval,
    rejection or requested revision. Validation alone is not approval.
  required_fields:
    - assertion
    - institutional_fact_type
    - evidence_passages
    - uncertainties
    - disposition
  allowed_human_decisions:
    - approve
    - reject
    - revise
  current_human_decision: approve_all_with_recorded_revisions
