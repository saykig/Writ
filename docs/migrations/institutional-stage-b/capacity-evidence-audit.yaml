rule: Every populated operational-capacity value must map to a cited passage and an exact fragment of that passage.
date_and_quantity_treatment: >-
  No active Stage B capacity payload retains as_of_date or quantity. The captures establish the
  reported counts, but their selected quotations do not state a calendar date. Counts remain in
  assertions and evidence rather than being paired with an inferred as-of date.
