  Human disposition:

  I approve the complete three-sentence text of NIST Handbook 150 §1.3.5 and only sentence 1 of §3.5.3 as the corrected excerpt extents.

  Together with 15 CFR §285.9(a), these passages continue to support the narrowly scoped assertion that NIST, through NVLAP, determines whether a testing or calibration laboratory has demonstrated the competence required for accreditation within a specified scope.

  Supersede the old evidence-bearing record and its approval with corrected successor versions. Preserve the old passage identities, record, judgment, review rationale, and Git history. Do not edit the approved material in place, and do not withdraw the substantive assertion.
