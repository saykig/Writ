  - id: KERNEL-CONTRACT-DISPATCH-001
    title: Make Writ source and record-contract dispatch exact
    status: done
    dependencies:
      - NIST-PROVING-GROUND-HARDENING-001
    scope:
      - Map each supported source dialect explicitly to its emitted Core and family contract versions.
      - Keep compilation pure while making repository validation independently enforce manifest-declared contracts.
      - Make judgment compilation and data-bundle contract-version handling fail closed on exact unsupported versions.
      - Preserve frozen Writ 0.1 compatibility, current Writ 0.2 institutional semantics, and shared-Core family extensibility.
    exclusions:
      - Commission Decision records, Commission ontology, new corpus families, or corpus-content changes.
      - Schema, grammar, relation-vocabulary, canonical-JSON, query, reasoning, or compliance changes.
    acceptance:
      - Source dialect rather than incidental payload fields deterministically selects emitted record and judgment schema versions.
      - Direct compilation, manifest validation, and bundle projection agree on exact supported contract IDs and versions.
      - Mandatory compatibility, native-family, shared-Core, mixed-family, and unsupported-version adversarial cases pass.
      - Existing catalogued corpus projections remain semantically unchanged apart from commit-derived bundle metadata.
      - Formatting, linting, type checking, tests, data checks, verification, Python checks, build, and repository integrity pass.
    outputs:
      - packages/language
      - packages/data-bundle
      - TASKS.yaml
      - MANIFEST.sha256

  - id: KERNEL-NATIVE-PROVENANCE-001
    title: Give all current native records Core provenance parity
    status: done
    dependencies:
      - KERNEL-CONTRACT-DISPATCH-001
    scope:
      - Make exact governing contract metadata available for every loaded record.
      - Apply shared Core source, document-version, passage, quote-hash, and reference verification to every current native record.
      - Resolve repeated unqualified passage IDs by one deterministic logical passage signature across corpora.
      - Enforce catalog, manifest, contract, and compiled-record family coherence for supported catalogued contracts.
      - Keep bundle projection faithful to manifest-routed native source authority without becoming a second verifier.
    exclusions:
      - Commission Decision content, decision ontology, new corpus families, schemas, grammar, or relation vocabulary.
      - Canonical JSON, review-state policy, query, reasoning, compliance, database, or frontend changes.
      - Substantive NIST, European Commission, or legal-policy corpus changes.
    acceptance:
      - Every current native record is verified through its exact governing contract and shared Core evidence envelope.
      - Native source authority resolves only through deliberately manifest-routed structured source metadata.
      - Exact UTF-8 quote bytes determine passage hashes without normalization.
      - Repeated identical passage IDs resolve across corpora while conflicting signatures fail deterministically.
      - Core links and judgments use the same logical passage resolution semantics.
      - Supported catalogued contracts enforce catalog, manifest, contract, and compiled-record family coherence.
      - Frozen compatibility behavior and existing institutional semantic checks remain unchanged.
      - Existing semantic bundle sections remain unchanged apart from commit-derived metadata.
      - Formatting, linting, type checking, tests, data checks, verification, Python checks, build, CI, and repository integrity pass.
    outputs:
      - internal/verification/writ
      - packages/data-bundle
      - TASKS.yaml
      - MANIFEST.sha256

  - id: KERNEL-PORTABLE-PROVENANCE-001
    title: Falsify the portable generic provenance-kernel boundary
    status: in_progress
    dependencies:
      - KERNEL-NATIVE-PROVENANCE-001
    scope:
      - Audit current Writ and Aldera provenance behavior into portable, repository-adapter, domain-specific, and not-proven-generic categories.
      - Make only the coherent generic evidence substrate in @writ/provenance independently consumable as a packed Node.js 22 package.
      - Refactor the Writ repository verifier to consume the extracted hashing, source/version, and logical-passage primitives.
      - Use Aldera's tracked UCDP provenance shapes as a read-only external compatibility holdout.
    exclusions:
      - WritRecord, RepositorySnapshot, corpus routing, family contracts, institutional semantics, links, judgments, review policy, or lineage computation in the portable package.
      - Changes to corpora, schemas, grammar, protocols, reviewed records, ontology, query systems, databases, or frontend behavior.
      - Publishing the package to a remote registry or modifying Aldera.
    acceptance:
      - The package imports no Writ workspace or internal-verifier module and declares no undeclared runtime dependency.
      - An isolated Node.js 22 consumer installs and imports only the packed artifact without a Writ workspace symlink.
      - Aldera canonicalization, exact passage hashing, source/version resolution, document/passage hash checks, and passage-conflict semantics match.
      - Writ source authorization remains manifest-routed in its repository adapter while the generic kernel verifies only caller-supplied authority.
      - Caller and authority ordering are deterministic, malformed references fail closed, and canonical hashes remain unchanged.
      - Formatting, linting, type checking, tests, data checks, verification, build, package-content, protected-byte, and repository-integrity checks pass.
    outputs:
      - packages/provenance
      - internal/verification/writ
      - docs/verification/portable-provenance-kernel.md
      - TASKS.yaml
      - MANIFEST.sha256
