version: 3
project: writ

governing_definition: >-
  Writ is local infrastructure for explicit decision problems. It represents the variables,
  dependencies, uncertainty, information, actions, constraints, objectives, engine requests, and
  checked results needed for a bounded decision problem without making one mathematical formalism or
  application domain the core ontology.

execution_policy:
  one_task_per_change: true
  update_status_only_after_checks: true
  stop_at_acceptance_gate: true
  required_reading:
    - AGENTS.md
    - docs/current/product-definition.md
    - docs/current/decision-object.md
    - docs/current/roadmap.md

statuses:
  - ready
  - in_progress
  - review
  - done
  - blocked

tasks:
  - id: DECISION-OBJECT-001
    title: Define the first engine-neutral Writ decision object
    status: ready
    scope:
      - Define the smallest object that can state a bounded decision problem without assuming a domain.
      - Represent variables, dependencies or information structure, actions, constraints, objectives, uncertainty, and exact engine requests.
      - Keep provenance optional and typed so a supplied input can explain where it came from without making source tracking the center of the object.
      - Compare the proposed fields against at least two established decision or optimization systems before freezing a schema.
    exclusions:
      - A universal solver API, social-science ontology, autonomous decision-maker, hosted service, or LLM dependency.
      - New mathematical theory where an established engine already supplies the needed operation.
    acceptance:
      - One concise design note states the object, its invariants, and unsupported cases.
      - At least two donor systems are exercised locally on bounded examples and their translation losses are recorded.
      - The schema is not frozen until the donor comparison shows that its fields are necessary across more than one mathematical family.
    outputs:
      - docs/current/decision-object.md
      - schemas/analysis

  - id: LOCAL-KILLER-CASE-001
    title: Prove one useful local decision workflow
    status: blocked
    dependencies:
      - DECISION-OBJECT-001
    scope:
      - Select a non-social-science problem with interacting variables, uncertainty, competing actions, constraints or objectives, and a meaningful information structure.
      - Run the complete workflow locally without an LLM or network service.
      - Use an established mathematical engine rather than a Writ-built general solver.
      - Produce an inspectable Writ object, engine request, result, and independent check.
      - Compare the workflow with using the underlying engine directly.
    acceptance:
      - The case is reproducible from repository files on a fresh machine.
      - Writ catches or exposes something material that the direct-engine baseline leaves implicit.
      - The case does not depend on one application domain being encoded into Writ core.

  - id: ENGINE-CHECKER-THRESHOLD-001
    title: Test whether a portable checker is needed
    status: blocked
    dependencies:
      - LOCAL-KILLER-CASE-001
    scope:
      - Revisit Rust only if several supported result types need the same durable exact-checking layer.
      - Revisit Lean only if a stable theorem or checker property becomes a repeated dependency.
      - Keep Python, Julia, R, C++, or other engines in their native ecosystem when that is simpler and safer.
    acceptance:
      - Any language expansion is justified by a measured capability or trust-boundary need, not preference.
