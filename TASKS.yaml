version: 1
project: covenant
working_name_status: provisional
execution_policy:
  one_task_per_change: true
  update_status_only_after_tests: true
  stop_at_acceptance_gate: true
  required_reading:
    - AGENTS.md
    - 04_FORMAL_SEMANTICS.md
    - 11_TEST_AND_VALIDATION.md
statuses:
  - todo
  - ready
  - in_progress
  - blocked
  - review
  - done

phases:
  - id: CORE
    name: Canonical core
    gate: A deterministic schema-validated evaluator emits proof receipts and catches seeded rule defects.
  - id: LANG
    name: Language and compiler
    gate: The diversity-set methodologies compile from Covenant source to golden canonical IR.
  - id: DATA
    name: Evidence ledger and ingestion
    gate: Reviewed evidence can be frozen and traced to immutable source passages.
  - id: CORPUS
    name: 2025 benchmark
    gate: All 160 cells match or have reviewed discrepancies.
  - id: PRODUCT
    name: Studio and publication
    gate: A research team can author, review, evaluate, and publish without direct database editing.
  - id: PROD
    name: Production hardening
    gate: Security, recovery, audit, signing, and operational checks pass.

tasks:
  - id: CORE-001
    phase: CORE
    title: Bootstrap production monorepo and preserve root commands
    status: ready
    dependencies: []
    scope:
      - Create TypeScript workspaces for domain, schemas, evaluator, analyzer, compiler, language, provenance, CLI, API, and Studio.
      - Create Python workspace for ingest workers.
      - Add root format, lint, typecheck, test, and conformance commands.
      - Pin runtime and package manager versions.
      - Add CI skeleton and local Docker Compose skeleton.
    acceptance:
      - Root install succeeds from a clean checkout.
      - Root format, lint, typecheck, and test commands execute.
      - Empty packages respect documented dependency direction.
      - Reference-core tests remain runnable until superseded.
      - No network service is required for unit tests.
    outputs:
      - package.json
      - workspace configuration
      - CI workflow
      - runtime version files
      - package READMEs

  - id: CORE-002
    phase: CORE
    title: Implement canonical JSON Schema package
    status: todo
    dependencies: [CORE-001]
    scope:
      - Import and refine schemas from specs.
      - Add AJV validation and generated TypeScript types.
      - Add valid and invalid fixtures.
      - Add schema version registry.
    acceptance:
      - All examples validate.
      - Invalid fixtures fail at expected schema paths.
      - Generated types are reproducible.
      - Schema package has no API or database dependency.

  - id: CORE-003
    phase: CORE
    title: Implement RFC 8785-compatible canonical JSON and content hashes
    status: todo
    dependencies: [CORE-002]
    scope:
      - Canonicalize schema-valid JSON.
      - Normalize exact decimals and semantic fields.
      - Produce SHA-256 hashes.
      - Add golden cross-platform fixtures.
    acceptance:
      - Object key order and insignificant formatting do not change hashes.
      - Ordered arrays remain order-sensitive.
      - All golden hashes are stable.
      - Unsupported numeric representations fail explicitly.

  - id: CORE-004
    phase: CORE
    title: Implement four-valued truth kernel
    status: todo
    dependencies: [CORE-001]
    scope:
      - Implement true, false, unknown, and contested using support pairs.
      - Implement not, and, or, forall, and exists.
      - Emit proof nodes for operators.
    acceptance:
      - Exhaustive truth-table tests pass.
      - Empty quantifier behavior is tested.
      - No nullable Boolean is used in evaluator semantics.

  - id: CORE-005
    phase: CORE
    title: Implement typed scalar expression interpreter
    status: todo
    dependencies: [CORE-002, CORE-004]
    scope:
      - Implement literals, references, equality, comparison, set membership, Boolean composition, and explicit unknown values.
      - Add exact decimal and temporal scalar types.
      - Return typed proof nodes.
    acceptance:
      - Unknown and contested operands propagate according to formal semantics.
      - Type mismatches return stable diagnostics.
      - Exact decimal boundary tests pass.

  - id: CORE-006
    phase: CORE
    title: Implement finite action queries and uncertain count intervals
    status: todo
    dependencies: [CORE-005]
    scope:
      - Implement where, distinct-by, exists, forall, count, sum, ratio, and coverage.
      - Represent minimum and maximum counts when membership or identity is uncertain.
      - Implement action identity policies.
    acceptance:
      - Possible duplicates produce bounded counts or review blockers according to profile.
      - Threshold comparisons over count intervals return correct four-valued results.
      - Count behavior is property-tested.

  - id: CORE-007
    phase: CORE
    title: Implement classification engine
    status: todo
    dependencies: [CORE-005, CORE-006]
    scope:
      - Evaluate exclusive and multi-label classification blocks.
      - Implement priorities, otherwise behavior, and proof traces.
      - Preserve all matched rules.
    acceptance:
      - Equal-priority conflicting labels are unresolved.
      - Lower-priority matches appear in proofs.
      - Unknown does not trigger a default classification unless explicitly safe.

  - id: CORE-008
    phase: CORE
    title: Implement score branch evaluator and receipt builder
    status: todo
    dependencies: [CORE-003, CORE-006, CORE-007]
    scope:
      - Evaluate all branches.
      - Select unique highest-priority true result.
      - Produce unresolved results for decisive unknowns or ambiguity.
      - Build schema-valid canonical receipts.
    acceptance:
      - Same inputs produce byte-identical canonical receipts.
      - Receipts include qualifying, excluded, unresolved, and contested dependencies.
      - Same-result overlap is reported.
      - Different-result overlap is unresolved.

  - id: CORE-009
    phase: CORE
    title: Implement evaluator CLI
    status: todo
    dependencies: [CORE-008]
    scope:
      - Add evaluate and receipt verify commands.
      - Support JSON and human-readable output.
      - Avoid database and network dependencies.
    acceptance:
      - CLI evaluates sample IR and evidence.
      - Invalid inputs fail with stable codes.
      - Receipt verification detects tampering.

  - id: CORE-010
    phase: CORE
    title: Implement non-SMT methodology lint framework
    status: todo
    dependencies: [CORE-002, CORE-005]
    scope:
      - Add diagnostic types, source locations, severities, waivers, and stable codes.
      - Implement missing references, type, unit, time-axis, source-rationale, identity, and attribution diagnostics.
    acceptance:
      - Seeded lint fixtures produce exact diagnostics.
      - Waivers are typed, scoped, and versioned.
      - Publication profile fails on unwaived errors.

  - id: CORE-011
    phase: CORE
    title: Implement Z3 bounded score analysis
    status: todo
    dependencies: [CORE-010]
    scope:
      - Lower finite Boolean, enum, integer range, cardinality, and artifact-presence conditions to Z3.
      - Detect satisfiability, overlap, gaps, unreachable rules, and monotonicity counterexamples.
      - Minimize witnesses.
    acceptance:
      - AI-for-SMEs one-to-four range normalization produces the expected gap witness.
      - AI-for-SMEs zero-to-four range normalization produces the expected overlap witness.
      - Counteraction overlap is detected.
      - Dead and non-monotonic rule fixtures are detected.
      - Analyzer output is deterministic.

  - id: CORE-012
    phase: CORE
    title: Publish core conformance suite
    status: todo
    dependencies: [CORE-008, CORE-011]
    scope:
      - Move reference fixtures into an implementation-independent corpus.
      - Cover truth, expressions, time, quantities, identity, classification, scoring, proofs, canonicalization, and diagnostics.
    acceptance:
      - Canonical evaluator passes all conformance cases.
      - Suite can be consumed by an alternate evaluator.
      - Mutation tests demonstrate meaningful failure detection.

  - id: LANG-001
    phase: LANG
    title: Stabilize Covenant grammar from canonical IR
    status: todo
    dependencies: [CORE-002, CORE-008, CORE-010]
    scope:
      - Complete Langium grammar for packages, imports, sources, concepts, commitments, predicates, classifications, queries, score blocks, profiles, assertions, and scenarios.
      - Add literate Markdown extraction.
    acceptance:
      - Grammar parses all checked-in examples.
      - Invalid fixtures recover with useful diagnostics.
      - Formatter is idempotent.
      - No arbitrary code execution is supported.

  - id: LANG-002
    phase: LANG
    title: Implement symbol linking and type checking
    status: todo
    dependencies: [LANG-001]
    scope:
