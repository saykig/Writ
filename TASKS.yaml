version: 8
project: writ

governing_definition: >-
  Writ is local infrastructure for explicit decision problems. It represents the variables,
  dependencies, uncertainty, information, actions, constraints, objectives, engine requests, and
  checked results needed for a bounded decision problem while preserving the native meaning of the
  mathematical systems it connects.

execution_policy:
  one_task_per_change: true
  update_status_only_after_checks: true
  stop_at_acceptance_gate: true
  required_reading:
    - AGENTS.md
    - docs/current/product-definition.md
    - docs/current/design-principles.md
    - docs/current/decision-object.md
    - docs/current/roadmap.md

statuses:
  - ready
  - in_progress
  - review
  - done
  - blocked

tasks:
  - id: LOCAL-KILLER-CASE-001
    title: Prove one useful local decision workflow
    status: done
    result:
      - DecisionProgramming.jl, JuMP, and HiGHS reproduce the published limited-memory policy through a Writ adapter.
      - The independent checker confirms exact expected utility 7268121/10000.
      - A wrong value-table binding remains solvable by the donor but is rejected against the original Writ object.
      - An expanded-information model is rejected as a different decision problem.
    outputs:
      - experiments/decision-object/first-proving-case

  - id: SECOND-ENGINE-001
    title: Validate the same decision object through an independent engine
    status: done
    dependencies:
      - LOCAL-KILLER-CASE-001
    result:
      - pyAgrum 3.0.0 with Shafer-Shenoy LIMID inference returns the same policy as DecisionProgramming.jl.
      - The independent exact checker confirms the same expected utility 7268121/10000.
      - Shared influence-diagram structure and engine-specific details are recorded separately.
    outputs:
      - experiments/decision-object/first-proving-case/cross-engine-findings.md

  - id: SECOND-FAMILY-001
    title: Test Writ with probabilistic model checking
    status: in_progress
    dependencies:
      - SECOND-ENGINE-001
    rationale:
      - Robust optimization would reuse the JuMP/solver path already exercised by the first family and would not stress a sufficiently different semantic boundary.
      - A POMDP case would overlap with the information-availability lesson already established by the influence-diagram case.
      - Probabilistic model checking adds a quantitative request whose reward model, optimization direction, and stopping state must remain bound to the transition model.
    family: probabilistic model checking over a finite Markov decision process
    donor_stack:
      - Storm 1.14.0 through stormpy 1.14.0
      - Stormvogel 0.12.3 as the direct-model source and baseline
      - Storm's native C++ model-checking core remains responsible for quantitative analysis
    case:
      source_model: Stormvogel lion MDP
      source_reference: stormchecker/stormvogel@v0.12.3 stormvogel/examples/lion.py
      question: maximize expected accumulated reward from reward model R until Writ state dead is reached
      semantic_request:
        kind: expected_accumulated_reward_until_state
        reward_model: R
        direction: max
        stop_state: dead
      decision_object_must_bind:
        - initial state
        - stable state identity and source labels
        - action identity
        - transition probabilities
        - reward-model identity and values
        - optimization direction
        - stopping state identity
      direct_baseline: build the published lion MDP through Stormvogel and compile the semantic request to Storm property syntax
      writ_path: load the same substantive model from a structured Writ case and lower it to stormpy through a thin adapter
      independent_check: evaluate returned memoryless deterministic schedulers with exact rational arithmetic and enumerate the bounded stationary policy space to verify optimality
    negative_cases:
      - Change max to min while keeping the MDP, reward model, and stop state fixed. Storm may solve the altered request, but the result belongs to a different Writ query.
      - Change stop_state from dead to starving while keeping the MDP, reward model, and optimization direction fixed. The adapter must bind stable state identity to engine-safe property syntax rather than use the donor display label as the query identity.
    revision_history:
      - Stormvogel 0.12.0 was initially pinned because the lion example was present there, but its converter is incompatible with Stormpy 1.14.0 when a model has no state variables. The model itself was unchanged.
      - Stormvogel 0.12.3 keeps the same lion model, fixes the empty-valuation conversion path, and declares Stormpy 1.13.2 or newer. The proving case therefore uses 0.12.3 with Stormpy 1.14.0.
      - The first stopping-condition mutation used the donor display label 'starving :((' directly in Storm property syntax and failed to parse. The Writ request was revised to bind a stable stop-state ID; engine labels are now an adapter concern.
      - The first successful canonical Storm run returned the same scheduler from the direct and Writ paths but a floating value near 37732.63. Exact rational evaluation of that scheduler is 37750. The experiment therefore checks scheduler optimality exactly and records Storm's floating numeric result as a separate engine claim.
    revision_rule:
      - If the direct Storm workflow already exposes and binds the same semantics clearly enough that Writ adds no concrete checking or portability value, revise or replace the case before promotion.
      - If scheduler extraction, target binding, or exact checking depends on hidden Storm-specific ordering or syntax, record that boundary explicitly rather than normalizing it away.
    acceptance:
      - The complete case runs locally from repository files with pinned donor versions.
      - The direct donor baseline and Writ adapter agree on the canonical scheduler and Storm result.
      - An independent checker verifies scheduler optimality against the original rational model and semantic query.
      - The altered direction and altered stop-state requests are valid engine inputs and remain distinguishable from the canonical result.
      - Engine-reported floating values remain distinct from exact independent values when they differ.
      - The result identifies which concepts transfer from the first family and which belong only to the model-checking profile.
    outputs:
      - experiments/decision-object/second-family-model-checking

  - id: DECISION-OBJECT-001
    title: Promote the smallest shared Writ decision object
    status: blocked
    dependencies:
      - SECOND-FAMILY-001
    scope:
      - Promote only structure supported by the proving cases into the shared decision object.
      - Keep specialized mathematical semantics in typed engine profiles.
      - Define exact bindings, unsupported states, and result meanings at the adapter boundary.
    acceptance:
      - One concise design note states the shared object and its invariants.
      - The promoted fields are supported by evidence across different mathematical families.
      - Engine-specific fields remain outside the shared core.
    outputs:
      - docs/current/decision-object.md
      - schemas/analysis

  - id: ENGINE-CHECKER-THRESHOLD-001
    title: Test whether a portable checker is needed
    status: blocked
    dependencies:
      - DECISION-OBJECT-001
    scope:
      - Test Rust when several supported result types share a portable exact-checking need.
      - Test Lean when a stable theorem or checker property becomes a repeated dependency.
      - Keep Julia, Python, R, C++, and other mathematical engines in their native ecosystem where that gives the clearest boundary.
    acceptance:
      - Any language expansion is justified by a measured capability or trust-boundary need.
