version: 2
project: writ
governing_definition: >-
  Writ is a structured, source-grounded knowledge system and domain-specific language for
  political science and global affairs. It represents claims, institutions, laws, policies,
  theories, empirical findings, evidence and relationships while preserving provenance, scope,
  uncertainty, contestation and revision history. Questions are asked across corpora; they do not
  define corpora.

execution_policy:
  one_task_per_change: true
  update_status_only_after_checks: true
  stop_at_acceptance_gate: true
  required_reading:
    - AGENTS.md
    - docs/current/product-definition.md
    - docs/migrations/repository-reset/01-audit.md

statuses:
  - ready
  - in_progress
  - review
  - done
  - blocked

tasks:
  - id: RESET-001
    title: Audit and freeze the pre-reset repository
    status: done
    outputs:
      - docs/migrations/repository-reset/01-audit.md

  - id: RESET-002
    title: Replace the governing product definition
    status: done
    dependencies:
      - RESET-001
    scope:
      - Adopt the current product definition and invariants.
      - Archive the superseded compliance-product plan without changing its contents.
      - Correct current documentation drift.
    acceptance:
      - No current governing document defines Writ as a compliance or commitment DSL.
      - Historical compliance work remains inspectable and explicitly non-normative.
      - No runtime semantics, schemas, or corpus records change.
    outputs:
      - docs/current/product-definition.md
      - archive/plans/compliance-product-v1/README.md

  - id: RESET-003
    title: Remove external weighted-ordinal product artifacts
    status: done
    dependencies:
      - RESET-002
    scope:
      - Remove the external product corpus, generator, examples, copy, and historical references.
      - Preserve generic weighted-ordinal evaluation and structural analyzer behavior.
      - Replace source-specific test coverage with a small Writ-owned synthetic fixture.
      - Regenerate the tracked-tree checksum manifest.
    acceptance:
      - No tracked reference to the removed external product remains.
      - Generic weighted-ordinal capabilities retain analyzer, language, benchmark, and frontend coverage.
      - Typecheck, build, and affected tests pass.
    outputs:
      - packages/benchmark/test/fixtures/weighted-ordinal-methodology.writ
      - packages/benchmark/test/weighted-ordinal.test.ts

  - id: RESET-004
    title: Establish schema and protocol authority
    status: done
    dependencies:
      - RESET-003
    scope:
      - Make schemas the only active JSON Schema authority.
      - Separate core, extension, analysis, and versioned compatibility contracts.
      - Move language and API protocols out of the former mixed contract root.
      - Update schema IDs, consumers, generators, tests, documentation, and manifests.
      - Document the then-pending reference-core retirement path without deleting an active consumer.
    acceptance:
      - No active schema ambiguity remains.
      - No universal core record requires commitment, obligation, or score fields.
      - Schema validation, conformance, unit tests, typecheck, and build pass.
    outputs:
      - schemas/README.md
      - adr/0013-schema-and-protocol-authority.md
      - docs/migrations/repository-reset/04-schema-protocol-path-map.md
      - docs/migrations/repository-reset/08-reference-core-retirement.md

  - id: RESET-005
    title: Separate EU and US AI-governance corpora
    status: done
    dependencies:
      - RESET-004
    scope:
      - Preserve the complete reviewed EU-US pilot as an immutable historical archive.
      - Create independent EU and US jurisdictional corpora from the reviewed records.
      - Replace spreadsheet-order active references with deterministic identities and scalable references.
      - Preserve every legacy identifier through complete migration maps.
      - Keep the comparison question and headline derivation only as an archived saved query.
    acceptance:
      - The archive is byte-for-byte recoverable and carries a verified checksum manifest.
      - EU and US parent-review and atomic-claim counts match the authoritative reviewed input.
      - Source locators, passages, legal distinctions, unknowns, and review decisions are preserved.
      - Every legacy identifier resolves exactly once and no active relationship depends on a readable ref.
      - Tests, typecheck, build, and corpus validation pass.
    outputs:
      - archive/pilots/eu-us-ai-evaluation-v1
      - corpora/jurisdictions/eu/ai-governance
      - corpora/jurisdictions/us/ai-governance
      - adr/0014-stable-corpus-identities.md
      - docs/migrations/repository-reset/05-eu-us-corpus-migration.md

  - id: RESET-006
    title: Reclassify G7 and G20 as multilateral corpora
    status: done
    dependencies:
      - RESET-005
    acceptance:
      - G7 and G20 authoritative political records are preserved as one compatibility dataset each.
      - Source-reported judgments and Writ-derived results remain distinguishable.
      - G7's 87 actions and G20's incomplete 13-of-174 coverage remain explicit.
    outputs:
      - archive/compatibility/g7/2025-ai-sme
      - internal/verification/benchmarks/evaluator/g7-2025-ai-sme-score-reproduction
      - archive/compatibility/g20/2024-rio

  - id: RESET-007
    title: Establish saved queries and align interface language
    status: done
    dependencies:
      - RESET-006
    acceptance:
      - Questions reference versioned corpora without changing corpus identities.
      - The active interface uses Writ Lab and provenance-aware judgment language.
      - Dead paths are removed or explicitly classified and all validation passes.
    outputs:
      - queries/README.md
      - queries/eu-us-ai-governance-pilot/query.yaml
      - docs/migrations/repository-reset/07-handoff.md
      - docs/migrations/repository-reset/07-final-hygiene-input.md

  - id: RESET-008
    title: Perform the verified repository-hygiene pass
    status: done
    dependencies:
      - RESET-007
    scope:
      - Use docs/migrations/repository-reset/07-final-hygiene-input.md as the verified input.
      - Resolve only items whose consumers and retention requirements are proven.
      - Preserve historical and compatibility material until its retirement gate is met.

  - id: RETIRE-REFERENCE-CORE
    title: Replace the reference-core parity oracle with implementation-independent fixtures
    status: done
    dependencies:
      - RESET-007
    scope:
      - Convert parity inputs and outputs into implementation-independent conformance fixtures.
      - Prove canonical packages retain truth, unknown, score, witness, and replay coverage.
      - Remove reference-core consumers, workspace wiring, and the package in one bounded change.
    acceptance:
      - No test, script, workspace, or documentation consumer remains.
      - Conformance, unit tests, typecheck, and production build pass without reference-core.

  - id: INTERNALIZE-REPOSITORY-SUPPORT
    title: Consolidate active developer support under internal
    status: done
    dependencies:
      - RESET-008
    scope:
      - Move root verification, tooling, infrastructure, generated, and integration-test paths under internal.
      - Reclassify former public examples as active language, schema, or compatibility fixtures.
      - Preserve corpus semantics, reviewed records, protocol/query behavior, and archive bytes.
    acceptance:
      - No developer-support directory named in the migration remains at the root.
      - Every active consumer resolves the new path and the complete verification suite passes.
      - The old G7 AI-for-SMEs material is bounded as internal compatibility verification.

  - id: STAGE-1-RECORD-GRAMMAR
    title: Add the shared record grammar and pilot constitutional and institutional corpora
    status: done
    dependencies:
      - INTERNALIZE-REPOSITORY-SUPPORT
    scope:
      - Add authoritative shared record, legal-policy, institutional, and judgment schemas.
      - Extend the native Writ language, compiler, formatter, diagnostics, and domain contracts.
      - Add controlled artificial-intelligence topic aliases and adapt the reviewed US AI records.
      - Add a bounded constitutional-law importer with dry-run, sample, and validated full-import gates.
      - Add a small source-grounded NIST institutional corpus.
    acceptance:
      - Native Writ fixtures parse, compile, and validate against the authoritative schemas.
      - Existing language, corpus, query, provenance, and compatibility behavior remains intact.
      - Constitutional imports are deterministic, source-preserving, draft-only, and size-gated.
      - NIST records distinguish mandate, function, structure, authority, and operational capacity.
      - Formatting, linting, type checking, tests, conformance, build, drift, and manifest checks pass.
    outputs:
      - schemas/core/record.schema.json
      - schemas/extensions/legal-policy-record.schema.json
      - schemas/extensions/institutional-record.schema.json
      - schemas/extensions/record-judgment.schema.json
      - internal/verification/fixtures/record-grammar-v0.1
      - corpora/us/constitutional-law
      - corpora/us/institutions/nist

  - id: CORE-EVIDENCE-RECONCILIATION-001
    title: Add the read-only Core evidence diagnostic crosswalk
    status: done
    dependencies:
      - STAGE-1-RECORD-GRAMMAR
    scope:
      - Document basis, stance, support type, truth value, workflow status, reviewed parent decisions and snapshot review decisions as distinct concepts.
      - Add an internal, pure and read-only diagnostic projection for explicit evidence semantics and object-specific compatibility identities.
      - Resolve snapshot claims, passages, document versions and snapshot reviewed objects independently.
      - Derive five separate unresolved evidence-identity results from the three applicable unresolved provenance entries.
      - Test semantic totality, identity handling, determinism, semantic preservation and protected-byte integrity.
    exclusions:
      - A native Writ record, canonical Core schema or public interchange contract.
      - Use by corpus generation, mutation or migration.
      - Native Writ evidence syntax or language generation.
      - Record or evidence schema changes.
      - Manual claim rewrites or changes to reviewed, active or archived corpus semantics.
      - NIST substantive review, frontend work, domain ontology work or corpus expansion.
    acceptance:
      - Explicit source semantics remain mapped independently of target-identity resolution.
      - No basis, stance, support type, truth, workflow or review concept is inferred from another.
      - Exactly 27 frozen snapshot claims resolve to active claims.
      - Exactly 22 frozen passages resolve to active passages.
      - Exactly 10 frozen document versions resolve to active sources.
      - Exactly 27 snapshot reviews resolve to their reviewed snapshot claim objects without asserting active review-record equivalence.
      - EU-10A, EU-10B, EU-10C, EU-12 and US-02 each produce a separate unresolved evidence-identity result and remain accepted.
      - The existing 38-reference corpus-migration invariant remains valid and is reported separately.
      - Reviewed YAML, all 17 U.S. claims, source and passage hashes, active corpora, archived pilot bytes, existing Writ programs and six draft NIST records remain unchanged.
      - Formatting, linting, type checking, tests, conformance, build, corpus drift and checksum verification pass.
    outputs:
      - adr/0016-distinct-evidence-semantics-and-diagnostic-crosswalk.md
      - apps/ingest/src/writ_ingest/corpus/eu_us_ai_governance.py
      - apps/ingest/tests/test_evidence_crosswalk.py
      - internal/verification/integration/corpora/test_eu_us_ai_governance.py
      - MANIFEST.sha256

  - id: CORPUS-FAMILY-FOUNDATION-001
    title: Establish the permanent corpus-family and issuer-instrument architecture
    status: done
    dependencies:
      - CORE-EVIDENCE-RECONCILIATION-001
    scope:
      - Establish legal-policy and institutional as the two implemented native families.
      - Add authoritative corpus manifest, catalog and family-neutral record-link contracts.
      - Split the reviewed EU and US AI policy material into issuer-and-instrument corpora.
      - Move constitutional law and NIST institutional records into family-first paths.
      - Add only directly supported European Commission or AI Office institutional drafts.
      - Move record judgments to the analysis layer while preserving v0.1 compatibility.
      - Resolve active corpus paths through the root catalog.
    exclusions:
      - Changes to accepted EU or US substantive claim values or review decisions.
      - NIST substantive review or changes to its six records.
      - Open US Law adapter-metadata migration.
      - G7, G20, archived pilot, query architecture or frontend redesign.
    acceptance:
      - Every active native corpus has exactly one family and a valid family-first path.
      - All 15 EU and 17 US accepted claims occur once in their approved instrument corpora.
      - Stable identities, hashes, legacy references and unresolved states match the preservation inventory.
      - The retired EU and US subject-based corpus IDs are absent from the active catalog.
      - The six NIST records remain byte-identical automated drafts.
      - v0.1 record, institutional and judgment contracts remain available under compatibility.
      - All required local checks, drift guards and checksum verifications pass.
    outputs:
      - adr/0017-permanent-corpus-family-architecture.md
      - schemas/core/corpus-manifest.schema.json
      - schemas/core/corpus-catalog.schema.json
      - schemas/core/record-link.schema.json
      - corpora/catalog.yaml
      - corpora/legal-policy
      - corpora/institutional
      - docs/migrations/corpus-family-foundation

  - id: CORPUS-FAMILY-FOUNDATION-002
    title: Correct the corpus contract, boundary, supersession and determinism defects
    status: done
    dependencies:
      - CORPUS-FAMILY-FOUNDATION-001
    scope:
      - Replace the manifest record_schema declaration with an explicit native or compatibility record contract.
      - Add a narrowly scoped compatibility contract for the preserved reviewed EU-US payload.
      - Allow a publication corpus boundary and correct every leaf that overclaimed an instrument.
      - Make v0.2 judgment supersession directional and add explicit review-disposition judgment types.
      - Add record-to-record supersession and supporting records to the Core record-link contract.
      - Replace ambiguous leaf migration aliases with a root-level retired-corpus migration ledger.
      - Restore byte-level drift checking for the generated EU and US corpus files.
      - Preserve G7 and G20 as archived compatibility datasets outside the active corpora tree.
    exclusions:
      - Changes to accepted EU or US substantive claim values, identities, hashes or review decisions.
      - NIST substantive review or changes to its six automated draft records.
      - Changes to the approved issuer-and-instrument hierarchy.
      - Changes to G7, G20 or archived pilot bytes, or to frontend design.
    acceptance:
      - Every catalogued manifest declares one resolvable record contract and every listed record file validates against it.
      - No manifest describes the preserved reviewed payload as native legal-policy v0.2.
      - Every legal-policy boundary matches a registered source document or a preserved claim instrument label.
      - A judgment states supersession direction explicitly; self-supersession and cycles are rejected.
      - The v0.1 judgment contract is unchanged.
      - Active corpus IDs and aliases resolve uniquely and retired one-to-many IDs do not resolve.
      - A serialization-only change fails the generator drift check.
      - G7 and G20 are absent from the catalog and byte-identical to the recorded inventory.
    outputs:
      - schemas/compatibility/eu-us-ai-reviewed-v1/reviewed-corpus-document.schema.json
      - schemas/core/corpus-manifest.schema.json
      - schemas/core/corpus-catalog.schema.json
      - schemas/core/record-link.schema.json
      - schemas/analysis/record-judgment.schema.json
      - packages/domain/src/judgments.ts
      - packages/language/test/corpus-record-contracts.test.ts
      - internal/verification/integration/corpora
      - archive/compatibility
      - docs/migrations/corpus-family-foundation/g7-g20-archive-path-map.md

  - id: START-HERE-ONBOARDING-001
    title: Add the Start Here onboarding walkthrough
    status: done
    dependencies:
      - CORPUS-FAMILY-FOUNDATION-002
    scope:
      - Add Start Here as the first primary navigation destination.
      - Explain the source-to-answer path with the reviewed NIST placement example.
      - Link the completed walkthrough directly to Writ Lab.
    exclusions:
      - Changes to corpora, schemas, protocols, language packages, or reviewed records.
      - Local installation instructions, frontend redesign, or Stage B dependencies.
    acceptance:
      - A first-time reader can follow Source, Passage, Record, Corpus, Question, and Answer with trace.
      - The walkthrough remains readable on mobile and without motion.
      - Navigation, accessibility, frontend tests, type checking, and the production build pass.
    outputs:
      - apps/web/app/start-here/page.tsx
      - apps/web/components/start-here/start-here-walkthrough.tsx
      - apps/web/test/start-here.test.ts

  - id: START-HERE-SYSTEM-STORY-002
    title: Embed the current How it works model in Start Here
    status: done
    dependencies:
      - START-HERE-ONBOARDING-001
    scope:
      - Replace the repeated-card walkthrough with one explicit seven-state scroll model.
      - Keep one reviewed NIST Stage A evidence object continuous through human review and result provenance.
      - Preserve a complete mobile and reduced-motion reading.
      - Redirect the legacy How it works route into Start Here.
    exclusions:
      - Corpus, schema, DSL, source, passage, record or judgment changes.
      - Stage B data, retired benchmark framing or a new animation dependency.
      - Deployment, publication or pull-request changes.
    acceptance:
      - Source, Passage, Record, Review, Corpus, Query and Result are explicit and reachable.
      - The active stage rail, provenance focus and source continuity are keyboard accessible.
      - Desktop, tablet, mobile and reduced-motion presentations are readable without horizontal overflow.
      - Frontend tests, type checking, linting and the production build pass.
    outputs:
      - apps/web/app/start-here/page.tsx
      - apps/web/app/how-it-works/page.tsx
      - apps/web/components/how-it-works
      - apps/web/test/start-here.test.ts

  - id: CROSS-FAMILY-INTEROPERABILITY-001
    title: Establish reviewed legal-policy to institutional record links
    status: complete
    dependencies:
      - CORPUS-FAMILY-FOUNDATION-002
    scope:
      - Resolve institutional endpoints only through one approved identity record.
      - Store cross-family links with the institutional corpus that owns the canonical endpoint.
      - Add three directly evidenced EU AI Office assignments.
      - Preserve automated proposals as superseded history and record the completed human decisions independently.
      - Preserve unresolved mappings in a non-authoritative queue outside active corpus manifests.
    exclusions:
      - Changes to schemas, legal-policy corpus content, or institutional record semantics beyond the approved identifier migration.
      - Publisher-to-issuer inference, new institutional identities, source recovery, or provision creation.
      - Active derives-authority, implementation, enforcement, or applicability links.
    acceptance:
      - The three approved links, three accepted human judgments, and three superseded proposals validate independently.
      - NIST, the European Commission, and the EU AI Office each resolve to one approved identity record.
      - Unresolved candidates remain outside active manifests and never use unresolved as an evidence basis.
      - Protected records, evidence, hashes, and accepted judgments remain byte-identical.
      - The approved identifier revision resolves active references to eu_ai_office_tech_doc_receipt while retaining migration history.
      - Formatting, linting, type checking, tests, conformance, build, and pack validation pass.
    outputs:
      - adr/0019-cross-family-interoperability.md
      - docs/migrations/cross-family-interoperability
      - packages/domain/src/institution-resolution.ts
      - packages/language/test/cross-family-interoperability.test.ts

  - id: WRIT-VERIFICATION-HARNESS-001
    title: Add the deterministic, authority-traced Writ Verification Harness
    status: done
    dependencies:
      - CROSS-FAMILY-INTEROPERABILITY-001
    scope:
      - Add deterministic read-only ontology, interoperability, provenance and integrity gates.
      - Trace every blocking invariant to an authoritative schema, accepted ADR, canonical contract or mechanical requirement.
      - Reuse native/Core loaders and existing compatibility validation without creating a shadow ontology.
      - Add independent root commands and a dedicated CI verification job.
    exclusions:
      - Changes to corpus content, schemas, protocols, reviewed evidence or interface behavior.
      - Dynamic ADR interpretation, inferred SemVer support or verifier-owned domain vocabularies.
    acceptance:
      - Every verifier command passes independently on the current repository.
      - Synthetic violations fail with deterministic stable codes.
      - Existing validation remains green and the verifier never mutates tracked files.
      - No change under corpora, schemas or protocols appears against the approved base.
    outputs:
      - internal/verification/writ
      - adr/0020-deterministic-writ-verification.md
      - docs/verification/verification-harness.md
      - .github/workflows/ci.yml

  - id: WRIT-DATA-BUNDLE-001
    title: Export the deterministic canonical Writ data bundle
    status: review
    dependencies:
      - CORPUS-FAMILY-FOUNDATION-002
      - CROSS-FAMILY-INTEROPERABILITY-001
    scope:
      - Define a neutral Writ-owned versioned data-bundle contract.
      - Export every record routed through catalogued manifest record locations without review-state filtering.
      - Preserve exact canonical source, evidence, provenance, review state, relationships and judgments.
      - Add reproducible export and check commands with section and bundle hashes.
    exclusions:
      - Web presentation selections, Lab inputs, UI mappings, display ordering or search projections.
      - Package publication, repository splitting, schema changes or corpus content changes.
      - Changes to the Writ Verification Harness or alternate-root behavior.
    acceptance:
      - The bundle validates against its own contract and two clean exports are byte-identical.
      - Catalog and manifest membership yields 72 records including accepted, approved, draft, superseded and review-less canonical records.
      - Exact YAML and .writ source slices reparse to their canonical record identities.
      - Six Core record links and 44 record judgments retain their canonical states.
      - No generation timestamps, absolute machine paths or web-owned presentation decisions are exported.
      - Formatting, linting, type checking, tests, conformance, build and verification pass.
    outputs:
      - packages/data-bundle
      - package.json
      - .github/workflows/ci.yml
task_history:
  compliance_product_v1: archive/plans/compliance-product-v1/TASKS.yaml
