version: 11
project: writ

governing_definition: >-
  Writ is local infrastructure for explicit decision problems. It represents the variables,
  dependencies, uncertainty, information, actions, constraints, objectives, engine requests, and
  checked results needed for a bounded decision problem while preserving the native meaning of the
  mathematical systems it connects.

execution_policy:
  one_task_per_change: true
  update_status_only_after_checks: true
  stop_at_acceptance_gate: true
  required_reading:
    - AGENTS.md
    - docs/current/product-definition.md
    - docs/current/design-principles.md
    - docs/current/decision-object.md
    - docs/current/roadmap.md

statuses:
  - ready
  - in_progress
  - review
  - done
  - blocked

tasks:
  - id: LOCAL-KILLER-CASE-001
    title: Prove one useful local decision workflow
    status: done
    result:
      - DecisionProgramming.jl, JuMP, and HiGHS reproduce the published limited-memory policy through a Writ adapter.
      - The independent checker confirms exact expected utility 7268121/10000.
      - A wrong value-table binding remains solvable by the donor but is rejected against the original Writ object.
      - An expanded-information model is rejected as a different decision problem.
    outputs:
      - experiments/decision-object/first-proving-case

  - id: SECOND-ENGINE-001
    title: Validate the same decision object through an independent engine
    status: done
    dependencies:
      - LOCAL-KILLER-CASE-001
    result:
      - pyAgrum 3.0.0 with Shafer-Shenoy LIMID inference returns the same policy as DecisionProgramming.jl.
      - The independent exact checker confirms the same expected utility 7268121/10000.
      - Shared influence-diagram structure and engine-specific details are recorded separately.
    outputs:
      - experiments/decision-object/first-proving-case/cross-engine-findings.md

  - id: SECOND-FAMILY-001
    title: Test Writ with probabilistic model checking
    status: done
    dependencies:
      - SECOND-ENGINE-001
    family: probabilistic model checking over a finite Markov decision process
    donor_stack:
      - Storm 1.14.0 through stormpy 1.14.0
      - Stormvogel 0.12.3 as the direct-model source and baseline
      - Storm's native C++ model-checking core remains responsible for quantitative analysis
    case:
      source_model: Stormvogel lion MDP
      source_reference: stormchecker/stormvogel@v0.12.3 stormvogel/examples/lion.py
      semantic_request:
        kind: expected_accumulated_reward_until_state
        reward_model: R
        direction: max
        stop_state: dead
    result:
      - The direct Stormvogel baseline and Writ sparse-double adapter return the same maximizing scheduler: hunt when satisfied, hunt when hungry, hunt when starving, and rawr when full.
      - Their canonical double-precision Storm value is approximately 37732.6318503739.
      - Storm's exact-rational model checker returns exactly 37750 for the same canonical Writ model and request.
      - Independent rational policy evaluation and exhaustive enumeration of all 16 stationary deterministic policies also return exactly 37750 and confirm the scheduler is optimal.
      - For the min-direction mutation, exact Storm and the independent checker both return 0.
      - For the stop-at-starving mutation, exact Storm and the independent checker both return 7750; the sparse-double path reports approximately 7749.23504166989.
      - All three exact Storm runs use the same generated MDP digest, so only the mathematical request changes between the canonical and mutation cases.
      - Stable Writ state identity is bound to engine-safe query labels by the adapter.
    earned_shared_candidates:
      - stable typed mathematical identity
      - model inputs separate from a typed mathematical request
      - explicit adapter bindings from Writ identity to engine identity
      - engine and version metadata
      - numeric-domain and result-guarantee metadata
      - typed engine result
      - independent-check record with an explicit guarantee
    family_specific:
      - MDP state/action transition kernels
      - reward models
      - temporal stopping semantics
      - memoryless deterministic schedulers
      - Storm row groups, choice indices, synthetic labels, and property syntax
    revision_history:
      - Stormvogel 0.12.0 was replaced by 0.12.3 because its older converter fails with Stormpy 1.14.0 on this variable-free model; the lion model itself is unchanged.
      - The query target changed from donor display label to stable Writ state identity after Storm property parsing exposed the weakness of treating labels as mathematical identity.
      - The measurable float-versus-exact gap triggered a second execution path using Storm's exact-rational model checker from the same case.json.
      - The strengthened checker now requires exact Storm and the independent checker to agree on the canonical request and both semantic mutations.
    outputs:
      - experiments/decision-object/second-family-model-checking
      - experiments/decision-object/second-family-model-checking/cross-family-findings.md

  - id: DECISION-OBJECT-001
    title: Promote the smallest shared Writ decision object
    status: ready
    dependencies:
      - SECOND-FAMILY-001
    scope:
      - Promote only structure supported by the proving cases into the shared decision object.
      - Keep specialized mathematical semantics in typed engine profiles.
      - Define exact bindings, unsupported states, and result meanings at the adapter boundary.
    acceptance:
      - One concise design note states the shared object and its invariants.
      - The promoted fields are supported by evidence across different mathematical families.
      - Engine-specific fields remain outside the shared core.
    outputs:
      - docs/current/decision-object.md
      - schemas/analysis

  - id: ENGINE-CHECKER-THRESHOLD-001
    title: Test whether a portable checker is needed
    status: blocked
    dependencies:
      - DECISION-OBJECT-001
    scope:
      - Test Rust when several supported result types share a portable exact-checking need.
      - Test Lean when a stable theorem or checker property becomes a repeated dependency.
      - Keep Julia, Python, R, C++, and other mathematical engines in their native ecosystem where that gives the clearest boundary.
    acceptance:
      - Any language expansion is justified by a measured capability or trust-boundary need.
