      - Check generic, quantity, temporal, enum, set, and predicate types.
      - Produce source-mapped diagnostics.
    acceptance:
      - Cross-file references work with pinned imports.
      - Unit and time-axis errors are caught.
      - Editor diagnostics point to exact spans.

  - id: LANG-003
    phase: LANG
    title: Implement AST-to-IR compiler
    status: todo
    dependencies: [LANG-002, CORE-002]
    scope:
      - Lower language sugar to normalized core IR.
      - Generate source maps and resolved import lock.
      - Validate output with canonical schema.
    acceptance:
      - Golden IR matches hand-authored benchmark fixtures.
      - Compilation is deterministic.
      - Compiler does not depend on API or database packages.

  - id: LANG-004
    phase: LANG
    title: Implement language CLI and scenario runner
    status: todo
