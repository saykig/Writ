openapi: 3.1.0
info:
  title: Writ API
  version: 0.1.0
  summary: Minimal evidence-ledger command API.
  description: |
    Current implementation contract only. This API does not execute commitments,
    score records, analyze methodologies, or produce evaluation receipts.
servers:
  - url: http://localhost:3000
security:
  - bearerAuth: []
tags:
  - name: system
  - name: evidence
paths:
  /health:
    get:
      tags: [system]
      security: []
      operationId: getHealth
      responses:
        "200":
          description: Service health.
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status: { type: string, const: ok }
                  service: { type: string, const: "@writ/api" }
  /v1/claims:
    post:
      tags: [evidence]
      operationId: createClaim
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "201": { $ref: "#/components/responses/CommandResult" }
  /v1/claims/{id}/{command}:
    post:
      tags: [evidence]
      operationId: transitionClaim
      parameters:
        - $ref: "#/components/parameters/ObjectId"
        - name: command
          in: path
          required: true
          schema:
            type: string
            enum: [submit, accept, reject, contest, supersede]
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { $ref: "#/components/responses/CommandResult" }
        "201": { $ref: "#/components/responses/CommandResult" }
  /v1/actions:
    post:
      tags: [evidence]
      operationId: createAction
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "201": { $ref: "#/components/responses/CommandResult" }
  /v1/actions/{id}/{command}:
    post:
      tags: [evidence]
      operationId: transitionAction
      parameters:
        - $ref: "#/components/parameters/ObjectId"
        - name: command
          in: path
          required: true
          schema:
            type: string
            enum: [submit, accept, reject, contest, supersede]
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { $ref: "#/components/responses/CommandResult" }
        "201": { $ref: "#/components/responses/CommandResult" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    ObjectId:
      name: id
      in: path
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string }
  responses:
    CommandResult:
      description: Governed command result.
      content:
        application/json:
          schema:
            type: object
